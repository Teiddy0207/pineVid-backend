x-db-environment: &x-db-environment
  POSTGRES_SSL_MODE: "disable"
  POSTGRES_HOST: "db"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "db"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/.env}"
  POSTGRES_USER: "user"

x-rabbitmq-variables: &x-rabbitmq-variables
  RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-guest}"
  RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-guest}"

x-backend-app-environment: &x-backend-app-environment
  GOMAXPROCS: "1"
  # App
  APP_NAME: "go-clean-template"
  APP_VERSION: "1.0.0"
  # HTTP settings
  HTTP_PORT: "8080"
  HTTP_USE_PREFORK_MODE: "false"
  # Logger
  LOG_LEVEL: "debug"
  # PG
  PG_POOL_MAX: "2"
  PG_URL: "postgres://user:${POSTGRES_PASSWORD}@db:5432/db"
  # gRPC
  GRPC_PORT: "8081"
  # RMQ
  RMQ_RPC_SERVER: "rpc_server"
  RMQ_RPC_CLIENT: "rpc_client"
  RMQ_URL: "amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/"
  # NATS
  NATS_RPC_SERVER: "rpc_server"
  NATS_URL: "nats://${NATS_USER:?set NATS_USER in backend/.env}:${NATS_PASSWORD:?set NATS_PASSWORD in backend/.env}@nats:4222/"
  # Metrics
  METRICS_ENABLED: "true"
  # Swagger
  SWAGGER_ENABLED: "true"
  # Tracing
  TRACING_ENABLED: "true"
  TRACING_OTLP_ENDPOINT: "jaeger:4317"
  TRACING_OTLP_INSECURE: "true"
  TRACING_SAMPLE_RATE: "${TRACING_SAMPLE_RATE:-0.1}"
  # JWT
  JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in backend/.env}"
  JWT_TOKEN_EXPIRY: "${JWT_TOKEN_EXPIRY:-1h}"
  JWT_REFRESH_TOKEN_EXPIRY: "${JWT_REFRESH_TOKEN_EXPIRY:-168h}"
  # Shared with the transcode worker and SRS hooks (service-to-service auth)
  INTERNAL_WEBHOOK_SECRET: "${INTERNAL_WEBHOOK_SECRET:?set INTERNAL_WEBHOOK_SECRET in backend/.env}"
  # Browser origins allowed by CORS (the Next.js frontend)
  CORS_ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS:-http://localhost:3000}"
  # nginx sits in front of the app on the compose network; trust its
  # X-Forwarded-For for the real client IP (view dedup, rate limits)
  HTTP_TRUSTED_PROXIES: "${HTTP_TRUSTED_PROXIES:-172.16.0.0/12}"
  # Redis (view counter dedup + like cache)
  REDIS_URL: "redis:6379"
  # MinIO (raw video / DVR storage)
  MINIO_ENDPOINT: "minio:9000"
  # SRS's own http_api (read-only stream list), polled for is_live
  # reconciliation — must be the in-cluster service name, not localhost.
  SRS_API_URL: "http://srs:1985"
  SRS_HTTP_URL: "http://srs:8080"
  LIVE_HLS_ENABLED: "${LIVE_HLS_ENABLED:-false}"
  LIVE_HLS_PUBLIC_URL: "${LIVE_HLS_PUBLIC_URL:-http://localhost:8082}"
  MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:?set MINIO_ROOT_USER in backend/.env}"
  MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in backend/.env}"
  MINIO_USE_SSL: "false"
  # DVR — must be the same host path SRS writes recordings to (see the srs
  # service's ./dvr-data mount) so HandleDVRComplete can read the file back.
  DVR_LOCAL_DIR: "/dvr-data"


services:
  db:
    container_name: db
    image: postgres:18.4-alpine
    environment:
      <<: *x-db-environment
    volumes:
      - db_data:/var/lib/postgresql
    ports:
      - "5435:5432"
    networks:
      app_network:
        aliases:
          - db.lvh.me

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:4.3.4-management
    environment:
      <<: *x-rabbitmq-variables
    ports:
      - "15672:15672"
      - "5672:5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      app_network:
        aliases:
          - rabbitmq.lvh.me

  nats:
    container_name: nats
    image: nats:2.14-alpine
    # -js enables JetStream — required by pkg/nats/publisher.go (video.transcode
    # stream) and the transcode/worker service's durable consumer; without it
    # both fail with "nats: jetstream not enabled".
    command: [ "-js", "-m", "8222", "-sd", "/nats-data", "-user", "${NATS_USER}", "-pass", "${NATS_PASSWORD}" ]
    ports:
      # Host ports shifted off the NATS defaults (4222/8222) — another
      # unrelated project's container already occupies those on this host.
      # In-cluster traffic still uses nats:4222 regardless of this mapping.
      - "4223:4222"
      - "8223:8222"
    volumes:
      - nats_data:/nats-data
    networks:
      app_network:
        aliases:
          - nats.lvh.me

  redis:
    container_name: redis
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      app_network:
        aliases:
          - redis.lvh.me

  jaeger:
    container_name: jaeger
    image: jaegertracing/all-in-one:1.76.0
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
      - "6831:6831/udp" # Jaeger agent UDP
    networks:
      app_network:
        aliases:
          - jaeger.lvh.me

  app:
    container_name: app
    platform: linux/amd64
    dns:
      - 127.0.0.11
      - 8.8.8.8
      - 1.1.1.1
    build:
      context: .
    environment:
      <<: *x-backend-app-environment
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      - db
      - rabbitmq
      - jaeger
      - redis
      - minio
      - srs
    volumes:
      - ./dvr-data:/dvr-data
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: '2Gb'
        reservations:
          cpus: '0.60'
          memory: '1Gb'
    networks:
      app_network:
        aliases:
          - app.lvh.me

  nginx:
    container_name: nginx
    image: nginx:1.31.3-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    depends_on:
      - rabbitmq
      - app
    networks:
      app_network:
        aliases:
          - nginx.lvh.me


  minio:
    container_name: minio
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
      # Browser uploads (PUT) and HLS playback come from the frontend origin
      MINIO_API_CORS_ALLOW_ORIGIN: "${CORS_ALLOW_ORIGINS:-http://localhost:3000}"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      app_network:
        aliases:
          - minio.lvh.me

  srs:
    container_name: srs
    image: ${SRS_IMAGE:-ossrs/srs:5}
    # mkdir+chmod first: SRS (root) would otherwise create objs/dvr/live with
    # 755, which the backend process (running as an unprivileged host user)
    # can't delete recordings from after uploading them to S3.
    entrypoint: ["/bin/sh", "-c"]
    # The http_hooks URLs (incl. the internal webhook secret) are rendered
    # from srs/live.conf.tpl at startup, so the secret lives only in .env.
    command: ["mkdir -p objs/dvr/live && chmod -R 777 objs/dvr && sed -e \"s|__SRS_HOOK_BASE_URL__|$$SRS_HOOK_BASE_URL|g\" -e \"s|__INTERNAL_WEBHOOK_SECRET__|$$INTERNAL_WEBHOOK_SECRET|g\" -e \"s|__LIVE_TRANSCODE_ENABLED__|${LIVE_TRANSCODE_ENABLED:-off}|g\" -e \"s|__LIVE_720_ENABLED__|${LIVE_720_ENABLED:-on}|g\" -e \"s|__LIVE_480_ENABLED__|${LIVE_480_ENABLED:-on}|g\" conf/live.conf.tpl > conf/live.conf && exec ./objs/srs -c conf/live.conf"]
    environment:
      INTERNAL_WEBHOOK_SECRET: "${INTERNAL_WEBHOOK_SECRET}"
      # Where SRS reaches the backend: the host when the backend runs via
      # `go run` (default), or http://app:8080 when the app runs in compose.
      SRS_HOOK_BASE_URL: "${SRS_HOOK_BASE_URL:-http://host.docker.internal:8080}"
    volumes:
      - ./srs/live.conf.tpl:/usr/local/srs/conf/live.conf.tpl:ro
      - ./dvr-data:/usr/local/srs/objs/dvr
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "1935:1935"
      - "1985:1985"
      - "8082:8080"
    networks:
      app_network:
        aliases:
          - srs.lvh.me

  transcode-worker:
    container_name: transcode-worker
    platform: linux/amd64
    build:
      context: ../transcode
      dockerfile: Dockerfile.worker
    environment:
      NATS_URL: "nats://${NATS_USER}:${NATS_PASSWORD}@nats:4222"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD}"
      MINIO_USE_SSL: "false"
      BACKEND_WEBHOOK_URL: "http://app:8080/internal/webhooks/transcode"
      BACKEND_BASE_URL: "http://app:8080"
      INTERNAL_WEBHOOK_SECRET: "${INTERNAL_WEBHOOK_SECRET}"
      RENDITIONS: "720p,480p"
      FFMPEG_PATH: "/usr/local/bin/ffmpeg"
      FFPROBE_PATH: "/usr/local/bin/ffprobe"
    depends_on:
      - nats
      - minio
      - app
    restart: unless-stopped
    networks:
      - app_network

  view-sync:
    container_name: view-sync
    build:
      context: ../view-sync
      dockerfile: Dockerfile
    environment:
      # view-sync reads REDIS_ADDR (REDIS_URL was silently ignored)
      REDIS_ADDR: "redis:6379"
      PG_URL: "postgres://user:${POSTGRES_PASSWORD}@db:5432/db"
      VIEW_SYNC_INTERVAL: "2m"
    depends_on:
      - redis
      - db
    restart: unless-stopped
    networks:
      - app_network

  # Consumes the Redis Stream live:events (live chat + hearts) and writes
  # live_chat_messages / live_session_stats. Scale out with
  # `docker compose up -d --scale live-agg=2` — replicas share the work via
  # the consumer group (container_name is omitted so scaling works).
  live-agg:
    build:
      context: ../live-agg
      dockerfile: Dockerfile
    environment:
      REDIS_ADDR: "redis:6379"
      PG_URL: "postgres://user:${POSTGRES_PASSWORD}@db:5432/db"
    depends_on:
      - redis
      - db
    restart: unless-stopped
    networks:
      - app_network

networks:
  app_network:
    external: false

volumes:
  db_data:
  rabbitmq_data:
  nats_data:
  minio_data:
  redis_data:

